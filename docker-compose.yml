services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hackit_sentry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/errkyde/hackitsentry-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./downloads:/app/downloads
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:${SERVER_PORT:-5000}"
      ConnectionStrings__DefaultConnection: "Host=db;Database=hackit_sentry;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Key: "${JWT_KEY:-change-this-secret-in-production-must-be-at-least-32-chars!!}"
      Encryption__Key: "${ENCRYPTION_KEY:-change-this-aes-key-in-production-32chars!!}"
      CheckinIntervalMinutes: ${CHECKIN_INTERVAL_MINUTES:-30}
      OutpostPublicUrl: "${OUTPOST_PUBLIC_URL:-}"
      Email__Host: "${EMAIL_HOST:-}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__Username: "${EMAIL_USERNAME:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__From: "${EMAIL_FROM:-sentry@localhost}"
      Email__To: "${EMAIL_TO:-}"
      Email__UseSsl: "${EMAIL_USE_SSL:-false}"
      RustDeskPublicHost: "${RUSTDESK_PUBLIC_HOST:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${SERVER_PORT:-5000}/api/auth/login || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  outpost:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${OUTPOST_PORT:-8031}:80"
    volumes:
      - ./outpost.conf:/etc/nginx/conf.d/default.conf:ro
      - ./downloads:/srv/downloads:ro

  frontend:
    image: ghcr.io/errkyde/hackitsentry-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${FRONTEND_PORT:-8030}:80"
    environment:
      SERVER_PORT: "${SERVER_PORT:-5000}"

  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${RUSTDESK_PUBLIC_HOST:-}:21117
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - rustdesk_data:/root
    restart: unless-stopped

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - rustdesk_data:/root
    restart: unless-stopped

volumes:
  postgres_data:
  rustdesk_data:
