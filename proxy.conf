# HITSight — SaaS reverse proxy
# Nginx template — ${PLATFORM_DOMAIN} is substituted at container start.
# Place this file at proxy.conf and mount it as a .template so the nginx
# docker entrypoint runs envsubst on it.
#
# SSL: uncomment the HTTPS server block and mount your wildcard certificate
# at /etc/ssl/certs/fullchain.pem and /etc/ssl/private/privkey.pem.
# See DEPLOYMENT.md for instructions.

resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP → HTTPS redirect (uncomment once SSL is configured) ─────────────────
# server {
#     listen 80;
#     server_name ${PLATFORM_DOMAIN} *.${PLATFORM_DOMAIN};
#     return 301 https://$host$request_uri;
# }

# ── Main server block — root domain + all tenant subdomains ──────────────────
server {
    listen 80;
    # listen 443 ssl;
    server_name ${PLATFORM_DOMAIN} *.${PLATFORM_DOMAIN};

    # ── SSL (uncomment when certificates are in place) ──────────────────────
    # ssl_certificate     /etc/ssl/certs/fullchain.pem;
    # ssl_certificate_key /etc/ssl/private/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 100m;

    # Long-poll agent endpoint needs generous timeouts
    location = /api/agent/commands/wait {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    # Everything else → frontend (serves SPA + proxies /api/* to backend)
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }
}
