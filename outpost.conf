resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    set $backend "server:5000";

    # Installer download
    location /install/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # High-frequency agent endpoints — no access log
    location = /api/agent/commands/pending {
        access_log off;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/agent/register/[^/]+/status$ {
        access_log off;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent communication only
    location /api/agent/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file downloads (agent builds etc.)
    location /downloads/ {
        alias /srv/downloads/;
        autoindex off;
        add_header Content-Disposition attachment;
    }

    # Block everything else
    location / {
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>.</title></head><body><p>Du bist ein Bastard</p></body></html>';
        add_header Content-Type text/html;
    }
}
