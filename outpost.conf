resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    set $backend "server:5000";

    # Installer download
    location /install/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # High-frequency agent endpoints — no access log
    location = /api/agent/commands/pending {
        access_log off;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/agent/register/[^/]+/status$ {
        access_log off;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent binary downloads (temporary — remove after all agents are on 1.0.27+)
    location /downloads/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Agent communication only
    location /api/agent/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block everything else
    location / {
        default_type text/html;
        return 403 '<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kein Zugriff</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f0f;color:#e5e5e5;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:2.5rem;max-width:400px;width:100%;text-align:center}.icon{font-size:2.5rem;margin-bottom:1rem}.brand{font-size:.75rem;color:#555;margin-bottom:1.5rem;letter-spacing:.05em;text-transform:uppercase}h1{font-size:1.1rem;font-weight:600;margin-bottom:.5rem}p{font-size:.875rem;color:#777;line-height:1.6}</style></head><body><div class="card"><div class="icon">🔒</div><div class="brand">HITSight</div><h1>Kein Zugriff</h1><p>Diese Seite ist nicht öffentlich zugänglich.</p></div></body></html>';
    }
}
